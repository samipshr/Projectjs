<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantastic Three</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/main.js" defer></script>
    <script src="js/player.js" defer></script>
    <script src="js/battle.js" defer></script>
    <script src="script.js" defer></script>    

</head>
<body>
    <header>
        <h1> Fantastic Three - Samip , Richard and Hoang </h1>
        <nav class="header">
            <button class="header_button" href="#">Home</button>
            <button class="header_button" href="#">Something</button>
            <button class="header_button" href="#">Something Else</button>
        </nav>
    </header>
        <!-- settings button - this is for the pop up, click on it and it opens up to more options. -->
    <!-- <button id="settings-button" type="button" onclick="openMenu()"> ⚙ Settings</button> -->

    <!-- menu popup -->
    <div id="game-menu" class="popup">
        <div class="popup-content">
            <button class="close-button" type="button" onclick="closeMenu()">✖</button>
            <h2>Game Menu</h2>

            <!-- the main menu -->
            <div id="menu-buttons">
                <button type="button" onclick="showMenuPage('inventory-page')">Inventory</button>
                <button type="button" onclick="showMenuPage('something-page')">something?</button>
            </div>

            <!-- inventory -->
            <div id="inventory-page" class="menu-page">
                <h3>Inventory</h3>
                <ul id="item-list"></ul>
                <p>Dragon Balls</p>
                <figure>
                    <img src="images/db.png" alt="db">
                    <img src="images/db.png" alt="db">
                    <img src="images/db.png" alt="db">
                    <img src="images/db.png" alt="db">
                    <img src="images/db.png" alt="db">
                    <img src="images/db.png" alt="db">
                    <img src="images/db.png" alt="db">
                </figure>
                <button type="button" onclick="showMenuPage('menu-buttons')">Back</button>
            </div>

            <!-- something page -->
            <div id="something-page" class="menu-page">
                <h3>idk, fish?</h3>
                <p>idk, quit button ?</p>
                <button type="button" onclick="showMenuPage('menu-buttons')">Back</button>
            </div>
        </div>
    </div>

    <main id="game">
        <section id="start-screen">
            <div class="game-title">
                <img src="images/main_menu_picture.gif" alt="Fantastic Three Main Menu">
            </div>
            <nav class="main-menu">
                <button id="guide-button">Guide</button>
                <button id="play-button">Play</button>
                <button id="map-button">Map</button>
                <button id="quit-button">Quit</button>
            </nav>
        </section>

        <section id="map-screen" class="hidden">
            <div class="map">
                <figure>
                    <img src="images/map.png" alt="map">
                    <img class="back_icon" src="images/back_icon.png" alt="back_icon">
                    <img class="location_icon" id="kame_point" src="images/goku.png" alt="mappoint">
                    <img class="location_icon" id="satan_point" src="images/mappoint.png" alt="mappoint">
                    <img class="location_icon" id="east_point" src="images/mappoint.png" alt="mappoint">
                    <img class="location_icon" id="papaya_point" src="images/mappoint.png" alt="mappoint">
                    <img class="location_icon" id="jingeru_point" src="images/mappoint.png" alt="mappoint">
                    <img class="location_icon" id="north_point" src="images/mappoint.png" alt="mappoint">
                    <img class="location_icon" id="central_point" src="images/mappoint.png" alt="mappoint">
                    <img class="location_icon" id="pilaf_point" src="images/mappoint.png" alt="mappoint">
                    <img class="location_icon" id="yunzabit_point" src="images/mappoint.png" alt="mappoint">
                    <img class="location_icon" id="ginger_point" src="images/mappoint.png" alt="mappoint">
                    <img class="location_icon" id="baseru_point" src="images/mappoint.png" alt="mappoint">
                    <img class="location_icon" id="muscle_point" src="images/mappoint.png" alt="mappoint">
                    <img class="location_icon" id="karin_point" src="images/mappoint.png" alt="mappoint">
                    <img class="location_icon" id="redribbon_point" src="images/mappoint.png" alt="mappoint">
                    <img class="location_icon" id="jungle_point" src="images/mappoint.png" alt="mappoint">
                </figure>
            </div>
        </section>


        <section id="location-screen" class="hidden">
            <div class="top">
                <figure class="location-img">
                    <img id="location_img" src="images/kame_house.jpg" alt="Kamehouse">
                </figure>
            </div>

            <!-- shown after a defeat / respawn -->
            <p id="notice" class="hidden"></p>

            <!-- encounter: only appears at locations that still have an enemy -->
            <p id="notice" class="hidden"></p>
            <!-- Location dialogue -->
            <div id="dialogue-box">
                <p id="dialogue-text"></p>
                <button id="continue-button" type="button">Continue</button>
            </div>

            <div class="bot">
                <div class="left">
                    <button id="menu_btn">MENU</button>
                    <button id="map_btn">MAP</button>
                    <button id="save_btn">SAVE</button>
                    <button>...</button>
                </div>
                <div class="right">
                    <div class="live">
                        <p>LIVE</p>
                        <figure id="lives-icons"></figure>
                    </div>
                    <div class="stats">
                        <p>LV <span id="lvl">1</span></p>
                        <p>HP <span id="health">10/10</span></p>
                        <p>XP <span id="xp">0</span>/10</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- seperate battle screen, (this was made with hate :D ) -->
        <section id="battle-screen" class="hidden">

            <!-- Settings appears ONLY on this screen -->
            <button id="settings-button" type="button" onclick="openMenu()"> ⚙ Settings</button>
            <div id="encounter">
                <h2>Encounter!</h2>
                <h3 id="enemy-name">Enemy</h3>
                <img id="enemy-image" src="images/enemy.jpg" alt="Enemy">

            <div id="enemy-health-box"> Enemy HP: <span id="enemy-health">-</span>
            </div>

            <div id="battle-message"> 
                An enemy appears!
            </div>

            <div id="battle-actions">
                <button type="button" onclick="attackEnemy()" class="attack"> Attack </button>
                <button type="button" onclick="defendPlayer()" class="defend"> Defend </button>
                <button type="button" onclick="useItem()" class="item"> Use Item </button>
                <button type="button" onclick="runAway()" class="run"> Run Away </button>
            </div>

            <button id="fight-again" class="hidden" type="button" onclick="fightAgain()"> Fight Again </button>
            <button id="battle-map-button" type="button"> Return to Map </button>

            <!-- Player stats in battle -->
            <div class="battle-player-stats">
                <p>Level: <span id="battle-level">1</span></p>
                <p>Health: <span id="battle-health">10/10</span></p>
                <p>XP: <span id="battle-xp">0</span>/10</p>
                <p>Lives: <span id="battle-lives">3</span></p>
            </div>
        </section>
    </main>
</body>
</html>
